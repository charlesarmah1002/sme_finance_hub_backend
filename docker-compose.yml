version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme-finance-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
    environment:
      APP_ENV: local
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sme_finance_hub
      DB_USERNAME: appuser
      DB_PASSWORD: apppass
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      JWT_SECRET_KEY: local-dev-secret
      TOKEN_SIGNATURE: local-token-signature
      API_KEY: replace-me
      BREVO_API_KEY: replace-me
      SMTP_KEY: replace-me
      SMTP_PASSWORD: replace-me
      SMTP_USERNAME: replace-me
      MAIL_FROM: info@example.com
      MAIL_FROM_NAME: SME Finance Hub
      MAIL_REPLY_TO: info@example.com
    networks:
      - sme-finance-net

  nginx:
    image: nginx:1.27-alpine
    container_name: sme-finance-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sme-finance-net

  db:
    image: mysql:8.0
    container_name: sme-finance-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sme_finance_hub
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sme-finance-net

networks:
  sme-finance-net:
    driver: bridge

volumes:
  db_data:
